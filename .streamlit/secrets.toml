CLIENT_ID = "someid"
CLIENT_SECRET = "somesecret"

[admin_users]
"admin@example.com" = "changeme"

# ---------------------------------------------------------------------------
# OOTB (out-of-the-box) setups for the "Deploy new OOTB Setup" page.
# Source (template) credentials are the CLIENT_ID / CLIENT_SECRET above.
# project_ids are the TEMPLATE-company project ids that make up each setup.
# ---------------------------------------------------------------------------
[ootb]
source_region = "EU"   # "EU" or "US" — region the template company lives in

[ootb.setups.invoice_processing_a]
label       = "Invoice Processing — Setup A"
group       = "Invoice Processing"
project_ids = []   # e.g. ["<template-project-id-1>", "<template-project-id-2>"]

[ootb.setups.invoice_processing_b]
label       = "Invoice Processing — Setup B"
group       = "Invoice Processing"
project_ids = []

[ootb.setups.order_confirmation]
label       = "Order Confirmation"
group       = "Order Confirmation"
project_ids = []

[ootb.setups.order_management]
label       = "Order Management"
group       = "Order Management"
project_ids = []
